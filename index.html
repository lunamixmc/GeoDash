<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Update News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0f1d;
            background-image: 
                radial-gradient(at 50% 0%, rgba(31, 223, 114, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(0, 180, 216, 0.15) 0px, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #ffffff;
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(18, 24, 47, 0.85);
            border: 4px solid #1fdf72;
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 
                0 0 30px rgba(31, 223, 114, 0.3),
                inset 0 0 15px rgba(31, 223, 114, 0.1);
            max-width: 550px;
            width: 90%;
            position: relative;
            backdrop-filter: blur(10px);
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: #1fdf72;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px rgba(31, 223, 114, 0.5);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #e0e0e0;
        }

        .btn {
            display: inline-block;
            background: #1fdf72;
            color: #0c0f1d;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(31, 223, 114, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(31, 223, 114, 0.7);
            background: #26f07d;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>UPDATE NOTICE</h1>
        <p>We apologize that the update is taking longer than expected. Thank you for your patience, and we hope to get it done soon!</p>
        <a href="geo.html" class="btn">LET'S GO!</a>
    </div>

</body>
</html>
